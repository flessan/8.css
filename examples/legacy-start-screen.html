<!DOCTYPE HTML>
<html lang="en-US">

    <!--
		Historical 8.css demo: a cleaned-up reproduction of the original
		Windows-8-Metro-UI Start Screen prototype by SamWanekeya, using the
		current 8.css toolchain and a locally served Font Awesome 4.7.0.
		Styles: ../styles/main.css. Icons: ../dist/font-awesome/.
	-->

	<head>

			<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
			<title>Legacy Windows 8 Start Screen Prototype | 8.css</title>

			<link type="text/css" rel="stylesheet" href="../styles/main.css">
			<link rel="stylesheet" href="../dist/font-awesome/css/font-awesome.min.css">
		<!--	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">-->			
		
		
		<link rel="shortcut icon" href="../styles/images/favicon.ico">
		<link rel="apple-touch-icon-precomposed" sizes="57x57" href="../styles/images/apple-touch-icon-57x57.png" />
		<link rel="apple-touch-icon-precomposed" sizes="114x114" href="../styles/images/apple-touch-icon-114x114.png" />
		<link rel="apple-touch-icon-precomposed" sizes="72x72" href="../styles/images/apple-touch-icon-72x72.png" />
		<link rel="apple-touch-icon-precomposed" sizes="144x144" href="../styles/images/apple-touch-icon-144x144.png" />
		<link rel="apple-touch-icon-precomposed" sizes="60x60" href="../styles/images/apple-touch-icon-60x60.png" />
		<link rel="apple-touch-icon-precomposed" sizes="120x120" href="../styles/images/apple-touch-icon-120x120.png" />
		<link rel="apple-touch-icon-precomposed" sizes="76x76" href="../styles/images/apple-touch-icon-76x76.png" />
		<link rel="apple-touch-icon-precomposed" sizes="152x152" href="../styles/images/apple-touch-icon-152x152.png" />
		<link rel="icon" type="image/png" href="../styles/images/favicon-196x196.png" sizes="196x196" />
		<link rel="icon" type="image/png" href="../styles/images/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/png" href="../styles/images/favicon-32x32.png" sizes="32x32" />
		<link rel="icon" type="image/png" href="../styles/images/favicon-16x16.png" sizes="16x16" />
		<link rel="icon" type="image/png" href="../styles/images/favicon-128.png" sizes="128x128" />
		<meta name="application-name" content="&nbsp;"/>
		<meta name="msapplication-TileColor" content="#FFFFFF" />
		<meta name="msapplication-TileImage" content="../styles/images/mstile-144x144.png" />
		<meta name="msapplication-square70x70logo" content="../styles/images/mstile-70x70.png" />
		<meta name="msapplication-square150x150logo" content="../styles/images/mstile-150x150.png" />
		<meta name="msapplication-wide310x150logo" content="../styles/images/mstile-310x150.png" />
		<meta name="msapplication-square310x310logo" content="../styles/images/mstile-310x310.png" />
		</head>

		<body>

		<a class="site-link" href="../index.html">8.css</a>
		

  <div class="container">
  
		<div class="start-top">Start</div>

    <div class="mail">
      <i class="fa fa-envelope fa-3x mailIcon" aria-hidden="true"></i>
      <span class="mailmail">Mail</span>
    </div>

    <div class="skype">
      <i class="fa fa-skype fa-3x skypeIcon" aria-hidden="true"></i>
      <span class="skypeskype">Skype</span>
    </div>

    <div class="maps">
      <i class="fa fa-map fa-3x mapsIcon" aria-hidden="true"></i>
      <span class="mapsmap">Maps</span>
    </div>

    <div class="readin-list">
      <i class="fa fa-get-pocket fa-3x read-listIcon" aria-hidden="true"></i>
      <span class="read-listread">Reading List</span>
    </div>

    <div class="desktop">
      <i class="fa fa-windows fa-3x desktopIcon" aria-hidden="true"></i>
      <span class="desktopdesktop">Desktop</span>
    </div>

    <div class="calendar">
      <i class="fa fa-calculator fa-1x calendarIcon" aria-hidden="true"></i>
      <span class="calendarDate">13</span><br><span class="calendarDay">Thursday</span>
    </div>

    <div class="sports">
      <i class="fa fa-trophy fa-3x sportsIcon" aria-hidden="true"></i>
      <span class="sportssports">Sports</span>
    </div>

    <div class="weather">
      <i class="fa fa-sun-o fa-3x weatherIcon" aria-hidden="true"></i>
      <span class="weatherweather">Weather</span>
    </div>

    <div class="photos">
      <i class="fa fa-file-photo-o fa-3x photoIcon" aria-hidden="true"></i>
      <span class="photophoto">Photos</span>
    </div>

    <div class="help">
      <i class="fa fa-question-circle-o fa-3x helpIcon" aria-hidden="true"></i>
      <span class="helphelp">Help + Tips</span>
    </div>

    <div class="news">
      <i class="fa fa-newspaper-o fa-3x newsIcon" aria-hidden="true"></i>
      <span class="newsnews">News</span>
    </div>

    <div class="money">
      <i class="fa fa-line-chart fa-3x moneyIcon" aria-hidden="true"></i>
      <span class="moneymoney">Money</span>
    </div>

    <div class="people">
      <i class="fa fa-user fa-3x peopleIcon" aria-hidden="true"></i>
      <span class="peoplepeople">People</span>
    </div>

    <div class="ie">
      <i class="fa fa-internet-explorer fa-3x ieIcon" aria-hidden="true"></i>
      <span class="ieie">Internet Explorer</span>
    </div>

    <div class="video">
      <i class="fa fa-play-circle fa-2x videoIcon" aria-hidden="true"></i>
    </div>

    <div class="camera">
      <i class="fa fa-camera fa-2x cameraIcon" aria-hidden="true"></i>
    </div>

    <div class="game">
      <i class="fa fa-gamepad fa-2x gameIcon" aria-hidden="true"></i>
    </div>

    <div class="headPhone">
      <i class="fa fa-headphones fa-2x headPhoneIcon" aria-hidden="true"></i>
    </div>


    <div class="ws">
      <i class="fa fa-shopping-bag fa-2x wsIcon" aria-hidden="true"></i>
      <span class="wsws">Store</span>
    </div>

    <div class="fd">
      <i class="fa fa-spoon fa-4x fdIcon" aria-hidden="true"></i>
      <span class="fdfd">Food & Drink</span>
    </div>

    <div class="skydrive">
      <i class="fa fa-cloud fa-3x skydriveIcon" aria-hidden="true"></i>
      <span class="skydriveskydrive">SkyDrive</span>
    </div>

    <div class="health">
      <i class="fa fa-heartbeat fa-3x healthIcon" aria-hidden="true"></i>
      <span class="healthhealth">Health</span>
    </div>

  </div>
  <div class="footer">Say something</div>


</body>
</html>
