name: Publish to npm and GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@latest

      - name: Verify release tag matches package version
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_name="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${RELEASE_TAG#v}"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$package_version'."
            exit 1
          fi

          if [[ "$package_name" != "@flessan/8.css" ]]; then
            echo "::error::Unexpected package name '$package_name'."
            exit 1
          fi

          {
            echo "package_name=$package_name"
            echo "package_version=$package_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build package
        run: npm run build

      - name: Test package
        run: npm test

      - name: Pack package once for both registries
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/npm-pack.json"
          tarball_name="$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/npm-pack.json', 'utf8'))[0].filename")"
          test -f "$RUNNER_TEMP/$tarball_name"
          echo "tarball=$RUNNER_TEMP/$tarball_name" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Packages authentication
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PACKAGES_TOKEN" >> "$HOME/.npmrc"

      - name: Check whether this version is already published
        id: versions
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          set -euo pipefail

          check_version() {
            local registry="$1"
            local output

            if output="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry="$registry" 2>&1)"; then
              printf 'true'
            elif grep -q 'E404' <<< "$output"; then
              printf 'false'
            else
              printf '%s\n' "$output" >&2
              return 1
            fi
          }

          if npm_exists="$(check_version 'https://registry.npmjs.org')"; then
            :
          else
            echo "::error::Unable to check the npm registry."
            exit 1
          fi

          if github_exists="$(check_version 'https://npm.pkg.github.com')"; then
            :
          else
            echo "::error::Unable to check GitHub Packages."
            exit 1
          fi

          {
            echo "npm_exists=$npm_exists"
            echo "github_exists=$github_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm with provenance
        if: steps.versions.outputs.npm_exists == 'false'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public --registry=https://registry.npmjs.org/

      - name: Skip npm because this version already exists
        if: steps.versions.outputs.npm_exists == 'true'
        run: echo "This version already exists on npm; leaving it unchanged."

      - name: Publish to GitHub Packages
        if: steps.versions.outputs.github_exists == 'false'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --registry=https://npm.pkg.github.com

      - name: Skip GitHub Packages because this version already exists
        if: steps.versions.outputs.github_exists == 'true'
        run: echo "This version already exists on GitHub Packages; leaving it unchanged."
