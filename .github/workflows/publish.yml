name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use current npm CLI for trusted publishing
        run: npm install --global npm@latest
      - name: Build package
        run: npm run build
      - name: Test package
        run: npm test
      - name: Publish package with provenance
        run: npm publish --provenance
