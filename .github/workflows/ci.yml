name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: npm test
      - run: npm run build:site
      - name: Ensure generated CSS is committed
        run: git diff --exit-code -- src/8.css dist/8.css dist/gui docs/8.css
