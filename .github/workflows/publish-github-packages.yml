name: Publish to GitHub Packages

on:
  # Publish this package when a GitHub Release is published.
  release:
    types: [published]
  # Allows the first publication (or a deliberate retry) without creating another release.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          package-manager-cache: false

      - name: Build package
        run: npm run build

      - name: Test package
        run: npm test

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
